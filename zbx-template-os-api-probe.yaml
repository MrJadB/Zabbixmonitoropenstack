    - name: 'OpenStack probe fast: script failing'
      expression: last(/OS-API-Probe/os.fast.collect_ok)=0
    tags:
    - tag: impact
      value: monitoring
    - tag: service
      value: monitoring
    - tag: component
      value: os-probe-fast
  - uuid: 0bc57a71c3204403b36d1347067d82ee
    expression: last(/OS-API-Probe/os.fast.collect_ok)=0
    name: 'OpenStack probe fast: script failing'
    priority: HIGH
    description: 'Config error or crash - see item "Probe fast: global error". This is the probe, not the cloud, so it never counts as downtime.'
    tags:
    - tag: impact
      value: monitoring
    - tag: service
      value: monitoring
    - tag: component
      value: os-probe-fast
  - uuid: cc648f6faa5c426c83f28e7ce30e7c35
    expression: last(/OS-API-Probe/os.fast.probe_net_down)=1
    name: OpenStack probe host cannot reach any endpoint
    priority: HIGH
    description: Every attempted call got no response (or ref_url is unreachable). The proxy host network, routing or CA is broken - not the cloud. Every availability trigger depends on this one so a probe-side outage never counts as downtime.
