        description: 'No certificate could be read 2 rounds in a row: endpoint unreachable from the probe host, TLS handshake failure, or not https. See the error item.'
        dependencies:
        - name: 'OpenStack probe slow: script failing'
          expression: last(/OS-API-Probe/os.slow.collect_ok)=0
        tags:
        - tag: service
          value: '{#SERVICE}'
        - tag: layer
          value: L2
        - tag: impact
          value: monitoring
        - tag: component
          value: tls_cert
        - tag: endpoint
          value: '{#ID}'
      master_item:
        key: os.probe.slow
      lld_macro_paths:
      - lld_macro: '{#ID}'
        path: $.id
      - lld_macro: '{#SERVICE}'
        path: $.service
      - lld_macro: '{#LABEL}'
        path: $.label
      - lld_macro: '{#HOST}'
        path: $.host
      - lld_macro: '{#PORT}'
        path: $.port
      preprocessing:
      - type: JSONPATH
        parameters:
        - $.tls_certs
      - type: JAVASCRIPT
        parameters:
        - |-
          var a = JSON.parse(value), out = [];
          for (var i = 0; i < a.length; i++) {
            out.push({id: a[i].id, service: a[i].service, label: a[i].label, host: a[i].host, port: a[i].port});
          }
          return JSON.stringify(out);
      - type: DISCARD_UNCHANGED_HEARTBEAT
        parameters:
        - 1h
    - uuid: a9fa9f98f3ff477a97505c883a77942e
      name: S3 replication
      type: DEPENDENT
      key: os.mid.discovery.s3repl
      delay: '0'
      lifetime: '{$OS_LLD.LIFETIME}'
      description: One row per replication direction (s3_zones, or s3_peer_bucket with a single endpoint).
      item_prototypes:
      - uuid: a5198e2ca34e4960abf9b266bb2d3042
        name: 'S3 replication {#FROM} -> {#TO}: lag'
        type: DEPENDENT
        key: os.s3.repl.lag["{#ID}"]
        delay: '0'
        history: 31d
        value_type: FLOAT
        units: s
        description: Age of the {#FROM} marker read through the {#TO} endpoint (sync lag + up to one mid interval). A row appears once the marker was read successfully.
        preprocessing:
        - type: JSONPATH
          parameters:
          - $.s3_repl[?(@.id=='{#ID}')].lag_s.first()
        master_item:
          key: os.probe.mid
        tags:
        - tag: service
          value: s3
        - tag: layer
          value: L3
        - tag: component
          value: replication
        - tag: target
          value: '{#TO}'
      trigger_prototypes:
      - uuid: 712162fc53d44ff28bcb62111c16b3ad
        expression: min(/OS-API-Probe/os.s3.repl.lag["{#ID}"],#2)>{$OS_S3.REPL.LAG.WARN}
        name: 'OpenStack S3: replication {#FROM} -> {#TO} lag {ITEM.VALUE}'
        priority: WARNING
        opdata: '{ITEM.LASTVALUE}'
        description: Objects written in {#FROM} are not visible in {#TO} yet. Check `radosgw-admin sync status` on both zones. If the marker cannot be read at all, the S3 mid repl_from_{#FROM} call item shows why.
        dependencies:
        - name: 'OpenStack probe mid: script failing'
          expression: last(/OS-API-Probe/os.mid.collect_ok)=0
        tags:
        - tag: service
          value: s3
        - tag: layer
          value: L3
        - tag: impact
          value: stability
        - tag: component
          value: replication
        - tag: zone_from
          value: '{#FROM}'
        - tag: zone_to
          value: '{#TO}'
      master_item:
        key: os.probe.mid
      lld_macro_paths:
      - lld_macro: '{#ID}'
        path: $.id
      - lld_macro: '{#FROM}'
        path: $.from
      - lld_macro: '{#TO}'
        path: $.to
      preprocessing:
      - type: JSONPATH
        parameters:
        - $.s3_repl
      - type: JAVASCRIPT
        parameters:
        - |-
          var a = JSON.parse(value), out = [];
          for (var i = 0; i < a.length; i++) {
            out.push({id: a[i].id, from: a[i].from, to: a[i].to});
          }
          return JSON.stringify(out);
      - type: DISCARD_UNCHANGED_HEARTBEAT
        parameters:
        - 1h
    macros:
    - macro: '{$OS_API.ACCEPT}'
      value: '0'
      description: Extra 4xx code that is normal for one service, so it does not raise the "rejects the probe" trigger. Context = service tag, e.g. {$OS_API.ACCEPT:"barbican"} = 401. 0 = none.
    - macro: '{$OS_AUTH.WARN}'
      value: '5000'
      description: Token issue time warning / SLA threshold, ms (3 rounds > 5000ms).
    - macro: '{$OS_CERT.HIGH}'
      value: '7'
      description: Octavia amphora cert expiry, days - High.
    - macro: '{$OS_CERT.WARN}'
      value: '30'
      description: Octavia amphora cert expiry, days - Warning.
    - macro: '{$OS_CRED.EXPIRE.WARN}'
      value: '14'
      description: Probe application credential expiry warning, days.
    - macro: '{$OS_FAST.INTERVAL}'
      value: 2m
      description: 'Documentation only: must match os-probe-fast.timer.'
    - macro: '{$OS_FAST.NODATA}'
      value: 10m
      description: nodata() window for the fast master.
    - macro: '{$OS_FAST.RUNTIME.WARN}'
      value: '30000'
      description: Warn when the fast run takes longer, ms. Keep below fast_deadline_ms (40000).
    - macro: '{$OS_HV.CPU.HIGH}'
      value: '95'
      description: Hypervisor vCPU allocation, % - High.
    - macro: '{$OS_HV.CPU.WARN}'
      value: '85'
      description: Hypervisor vCPU allocation, % - Warning.
    - macro: '{$OS_HV.MEM.HIGH}'
      value: '95'
      description: Hypervisor memory allocation, % - High.
    - macro: '{$OS_HV.MEM.WARN}'
      value: '85'
      description: Hypervisor memory allocation, % - Warning.
    - macro: '{$OS_LATENCY.WARN}'
      value: '5000'
      description: API response time warning / SLA threshold, ms (3 rounds > 5000ms). Context = service tag, e.g. {$OS_LATENCY.WARN:"swift"} = 8000.
    - macro: '{$OS_LLD.LIFETIME}'
      value: 7d
      description: How long an undiscovered row survives (removed node, service).
    - macro: '{$OS_MAINT.STALE}'
      value: 7d
      description: Window for the "in maintenance longer than" trigger.
    - macro: '{$OS_MID.INTERVAL}'
      value: 5m
      description: 'Documentation only: must match os-probe-mid.timer.'
    - macro: '{$OS_MID.NODATA}'
      value: 20m
      description: nodata() window for the mid master.
    - macro: '{$OS_MID.RUNTIME.WARN}'
      value: '90000'
      description: Warn when the mid run takes longer, ms. Keep below mid_deadline_ms (120000).
    - macro: '{$OS_OCTAVIA.SPARE.MIN}'
      value: '0'
      description: Minimum spare amphorae. 0 = trigger off.
    - macro: '{$OS_POOL.FREE.HIGH}'
      value: '10'
      description: Cinder pool free space, % - High.
    - macro: '{$OS_POOL.FREE.WARN}'
      value: '20'
      description: Cinder pool free space, % - Warning.
    - macro: '{$OS_PROBE.RAW.HISTORY}'
      value: 1h
      description: History of the 3 raw JSON masters. Short on purpose (DB writes); raise to 1d while debugging.
    - macro: '{$OS_S3.REPL.LAG.WARN}'
      value: '900'
      description: S3 multisite replication lag warning, seconds (2 rounds). Includes up to one mid interval.
    - macro: '{$OS_RES.MAX}'
      value: '0'
      description: Accepted bad / stuck resource count. Context = resource id, e.g. {$OS_RES.MAX:"heat:stacks_failed"} = 5.
    - macro: '{$OS_SKIP.AZ.NOT_MATCHES}'
      value: (?i)(^kkn$|[-_.]kkn([-_.]|$))
      description: Regex of availability zones / cells to skip in discovery (e.g. unprovisioned AZs).
    - macro: '{$OS_SKIP.HOST.NOT_MATCHES}'
      value: (?i)(^kkn[-_.]|[-_.@]kkn([-_.0-9]|$))
      description: Regex of hostnames / pools / targets to skip in discovery (e.g. unprovisioned AZs/nodes).
    - macro: '{$OS_SLOW.INTERVAL}'
      value: 30m
      description: 'Documentation only: must match os-probe-slow.timer.'
    - macro: '{$OS_SLOW.NODATA}'
      value: 75m
      description: nodata() window for the slow master.
    - macro: '{$OS_TLS.AVERAGE}'
      value: '7'
      description: TLS certificate expiry, days - Average. Context = endpoint id host:port.
    - macro: '{$OS_TLS.HIGH}'
      value: '3'
      description: TLS certificate expiry, days - High. Context = endpoint id host:port.
    - macro: '{$OS_TLS.WARN}'
      value: '30'
      description: TLS certificate expiry, days - Warning. Context = endpoint id host:port.
    - macro: '{$OS_SLOW.RUNTIME.WARN}'
      value: '240000'
      description: Warn when the slow run takes longer, ms. Keep below slow_deadline_ms (300000).
    valuemaps:
    - uuid: be3ef2c1190149e3baa36a94b2ccfd9a
