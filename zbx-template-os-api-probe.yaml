      key: os.probe.slow
      history: '{$OS_PROBE.RAW.HISTORY}'
      trends: '0'
      value_type: TEXT
      description: |-
        Every {$OS_SLOW.INTERVAL} by os-probe-slow.timer. Glance canary (Range 0-0),
        stuck resources, Heat FAILED, Octavia amphorae / certs, credential expiry.
        Pushed by: os_probe.py --tier slow --send
      tags:
      - tag: service
        value: monitoring
      - tag: layer
        value: L3
      - tag: component
        value: os-probe-slow
