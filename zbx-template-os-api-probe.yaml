        tags:
        - tag: service
          value: '{#SERVICE}'
        - tag: layer
          value: L3
        - tag: component
          value: '{#BINARY}'
        - tag: node
          value: '{#HOST}'
      - uuid: b00f8ca1beca461f80d0b057d213e095
        name: '{#LABEL} {#BINARY} on {#HOST}: disabled reason'
        type: DEPENDENT
        key: os.agent.reason["{#ID}"]
        delay: '0'
        history: 7d
        trends: '0'
        value_type: CHAR
        preprocessing:
        - type: JSONPATH
          parameters:
          - $.agents[?(@.id=='{#ID}')].reason.first()
        - type: DISCARD_UNCHANGED_HEARTBEAT
