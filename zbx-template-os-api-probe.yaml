    expression: last(/OS-API-Probe/os.mid.rp_roots)>=0 and last(/OS-API-Probe/os.mid.hv.total)>=0 and last(/OS-API-Probe/os.mid.rp_roots)<>last(/OS-API-Probe/os.mid.hv.total)
    name: 'OpenStack Placement: root providers ({ITEM.LASTVALUE1}) differ from hypervisors ({ITEM.LASTVALUE2})'
