    - name: 'OpenStack probe slow: script failing'
      expression: last(/OS-API-Probe/os.slow.collect_ok)=0
    tags:
    - tag: service
      value: monitoring
    - tag: layer
      value: L3
    - tag: impact
      value: monitoring
    - tag: component
      value: app_credential
  - uuid: a4df8ada0eff460095066eb9d7752297
    expression: count(/OS-API-Probe/os.fast.auth.status,#2,"ge","400")-count(/OS-API-Probe/os.fast.auth.status,#2,"ge","500")>=2
    name: OpenStack probe credential rejected by Keystone (HTTP {ITEM.VALUE})
    priority: HIGH
    opdata: HTTP {ITEM.LASTVALUE}
    description: '401: application credential expired, deleted or wrong secret. 403: role removed. The cloud may be fine - only the probe lost access.'
    dependencies:
    - name: 'OpenStack probe fast: script failing'
      expression: last(/OS-API-Probe/os.fast.collect_ok)=0
    tags:
    - tag: service
      value: monitoring
    - tag: layer
      value: L3
    - tag: impact
      value: monitoring
    - tag: component
      value: token
    - tag: http_status
      value: '{ITEM.VALUE}'
  - uuid: 7ba73ec4af674c2ba8b15b114644bb2a
    expression: min(/OS-API-Probe/os.fast.checks_deadline,#3)>0
    name: 'OpenStack probe fast: hitting its deadline'
    priority: WARNING
