    tags:
    - tag: service
      value: s3
    - tag: layer
      value: L3
    - tag: impact
      value: availability
    - tag: component
      value: canary
    - tag: target
      value: vip
  - uuid: 9df70e0f4bff4e5493ccd4b5fcb2f1e3
    expression: last(/OS-API-Probe/os.slow.cred.expire_days)>=0 and last(/OS-API-Probe/os.slow.cred.expire_days)<{$OS_CRED.EXPIRE.WARN}
    name: OpenStack probe credential expires in {ITEM.VALUE} days
    priority: WARNING
    description: Create a new application credential with the monitoring role and update the ini on every proxy host before this one expires.
