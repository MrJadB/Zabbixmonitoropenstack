    description: No value from the fast timer. Check the systemd timer on the proxy host, journalctl -u os-probe@fast, and that zabbix_host in the ini matches this host name.
    tags:
    - tag: impact
      value: monitoring
    - tag: service
      value: monitoring
    - tag: component
      value: os-probe-fast
  - uuid: 2046b86f094244d09dbc2d33aacc579b
    expression: min(/OS-API-Probe/os.fast.total_ms,#3)>{$OS_FAST.RUNTIME.WARN}
    name: 'OpenStack probe fast: running slow'
