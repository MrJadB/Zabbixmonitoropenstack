    discovery_rules:
    - uuid: 35b02f5e5411427ab3aba12956b53e6b
      name: API checks
      type: DEPENDENT
      key: os.fast.discovery.checks
      delay: '0'
      lifetime: '{$OS_LLD.LIFETIME}'
      description: 'One row per check: L2 root per VIP and per node ({#TARGET}), L3 functional probes and service-record calls. All rows come from the fast master item - no extra API calls.'
      item_prototypes:
      - uuid: 45f3c787663e45f294f2337f89921e1d
        name: '{#LABEL} {#CHECK}{#AT}: HTTP status'
        type: DEPENDENT
        key: os.api.status["{#ID}"]
        delay: '0'
        history: 31d
        trends: '0'
        value_type: FLOAT
        description: Real HTTP code. 0 = no response, -1 = skipped (deadline, skip_types, no token).
        valuemap:
          name: HTTP status
        preprocessing:
        - type: JSONPATH
          parameters:
          - $.checks[?(@.id=='{#ID}')].http_status.first()
        master_item:
          key: os.probe.fast
        tags:
        - tag: service
          value: '{#SERVICE}'
        - tag: layer
          value: '{#LAYER}'
        - tag: component
          value: '{#CHECK}'
        - tag: node
          value: '{#NODE}'
      - uuid: ccabddad8c4f4818816b2fb8d010e0cb
        name: '{#LABEL} {#CHECK}{#AT}: response time'
        type: DEPENDENT
        key: os.api.ms["{#ID}"]
        delay: '0'
        history: 31d
        value_type: FLOAT
        units: ms
        preprocessing:
        - type: JSONPATH
          parameters:
          - $.checks[?(@.id=='{#ID}')].ms.first()
        master_item:
          key: os.probe.fast
        tags:
        - tag: service
          value: '{#SERVICE}'
        - tag: layer
          value: '{#LAYER}'
        - tag: component
          value: '{#CHECK}'
        - tag: node
          value: '{#NODE}'
      - uuid: fd9b6329f7854bbf9788f0f5b30961c9
        name: '{#LABEL} {#CHECK}{#AT}: error'
        type: DEPENDENT
        key: os.api.error["{#ID}"]
        delay: '0'
        history: 7d
        trends: '0'
        value_type: CHAR
        preprocessing:
        - type: JSONPATH
          parameters:
          - $.checks[?(@.id=='{#ID}')].error.first()
        - type: DISCARD_UNCHANGED_HEARTBEAT
          parameters:
          - 1h
        master_item:
          key: os.probe.fast
        tags:
        - tag: service
          value: '{#SERVICE}'
        - tag: layer
          value: '{#LAYER}'
        - tag: component
          value: '{#CHECK}'
        - tag: node
          value: '{#NODE}'
      trigger_prototypes:
      - uuid: b77d32eb00404f709e080606b62845cf
        expression: count(/OS-API-Probe/os.api.status["{#ID}"],#3,"eq","0")+count(/OS-API-Probe/os.api.status["{#ID}"],#3,"ge","500")>=3
        name: 'OpenStack {#LABEL}: {#CHECK} @ {#TARGET} is down (HTTP {ITEM.VALUE})'
        priority: HIGH
        recovery_mode: RECOVERY_EXPRESSION
        recovery_expression: count(/OS-API-Probe/os.api.status["{#ID}"],#2,"eq","0")+count(/OS-API-Probe/os.api.status["{#ID}"],#2,"ge","500")=0
        opdata: HTTP {ITEM.LASTVALUE}
        description: 3 rounds in a row (~5-6m) with no response (0) or 5xx. 502/503/504 usually HAProxy or the WSGI workers; 500 the service or its DB / RabbitMQ; 0 VIP, keepalived, network or TLS. A VIP root check is raised to Disaster by an LLD override.
        dependencies:
        - name: 'OpenStack probe fast: script failing'
          expression: last(/OS-API-Probe/os.fast.collect_ok)=0
        - name: OpenStack probe host cannot reach any endpoint
          expression: last(/OS-API-Probe/os.fast.probe_net_down)=1
        tags:
        - tag: service
          value: '{#SERVICE}'
        - tag: layer
          value: '{#LAYER}'
        - tag: impact
          value: availability
        - tag: component
          value: '{#CHECK}'
        - tag: node
          value: '{#NODE}'
        - tag: target
          value: '{#TARGET}'
        - tag: http_status
          value: '{ITEM.VALUE}'
      - uuid: 4f17227bd6f14bae935497605c531264
        expression: count(/OS-API-Probe/os.api.status["{#ID}"],#2,"ge","400")-count(/OS-API-Probe/os.api.status["{#ID}"],#2,"ge","500")>=2 and last(/OS-API-Probe/os.api.status["{#ID}"])<>{$OS_API.ACCEPT:"{#SERVICE}"}
        name: 'OpenStack {#LABEL}: {#CHECK} @ {#TARGET} rejects the probe (HTTP {ITEM.VALUE})'
        priority: AVERAGE
        opdata: HTTP {ITEM.LASTVALUE}
        description: '401/403: probe credential, role or policy. 404: probe path does not match this service version. Not counted as downtime. A code that is normal for one service can be accepted with {$OS_API.ACCEPT:"<service>"} = <code>.'
        dependencies:
        - name: 'OpenStack probe fast: script failing'
          expression: last(/OS-API-Probe/os.fast.collect_ok)=0
        tags:
        - tag: service
          value: '{#SERVICE}'
        - tag: layer
          value: '{#LAYER}'
        - tag: impact
          value: monitoring
        - tag: component
          value: '{#CHECK}'
        - tag: node
          value: '{#NODE}'
        - tag: target
          value: '{#TARGET}'
        - tag: http_status
          value: '{ITEM.VALUE}'
      - uuid: 492bf0f6db694ab693d8c233bd774cda
        expression: min(/OS-API-Probe/os.api.ms["{#ID}"],#3)>{$OS_LATENCY.WARN:"{#SERVICE}"}
        name: 'OpenStack {#LABEL}: {#CHECK} @ {#TARGET} is slow'
        priority: WARNING
        opdata: '{ITEM.LASTVALUE}'
        dependencies:
        - name: 'OpenStack {#LABEL}: {#CHECK} @ {#TARGET} is down (HTTP {ITEM.VALUE})'
          expression: count(/OS-API-Probe/os.api.status["{#ID}"],#3,"eq","0")+count(/OS-API-Probe/os.api.status["{#ID}"],#3,"ge","500")>=3
          recovery_expression: count(/OS-API-Probe/os.api.status["{#ID}"],#2,"eq","0")+count(/OS-API-Probe/os.api.status["{#ID}"],#2,"ge","500")=0
        tags:
        - tag: service
          value: '{#SERVICE}'
        - tag: layer
          value: '{#LAYER}'
        - tag: impact
          value: stability
        - tag: component
          value: '{#CHECK}'
        - tag: node
          value: '{#NODE}'
        - tag: target
          value: '{#TARGET}'
      master_item:
        key: os.probe.fast
      lld_macro_paths:
      - lld_macro: '{#ID}'
        path: $.id
      - lld_macro: '{#SERVICE}'
        path: $.service
      - lld_macro: '{#LABEL}'
        path: $.label
      - lld_macro: '{#CHECK}'
        path: $.check
      - lld_macro: '{#LAYER}'
        path: $.layer
      - lld_macro: '{#TARGET}'
        path: $.target
      - lld_macro: '{#NODE}'
        path: $.node
      - lld_macro: '{#IMPACT}'
        path: $.impact
      - lld_macro: '{#AT}'
        path: $.at
      preprocessing:
      - type: JSONPATH
        parameters:
        - $.checks
      - type: JAVASCRIPT
        parameters:
        - |-
          var a = JSON.parse(value), out = [];
          for (var i = 0; i < a.length; i++) {
            out.push({id: a[i].id, service: a[i].service, label: a[i].label, check: a[i].check, layer: a[i].layer, target: a[i].target, node: a[i].node, impact: a[i].impact, at: a[i].target === 'vip' ? '' : ' @ ' + a[i].target});
          }
          return JSON.stringify(out);
      - type: DISCARD_UNCHANGED_HEARTBEAT
        parameters:
        - 1h
      overrides:
      - name: VIP root check is Disaster
        step: '1'
        filter:
          evaltype: AND
          conditions:
          - macro: '{#TARGET}'
            value: ^vip$
            formulaid: A
          - macro: '{#LAYER}'
            value: ^L2$
            formulaid: B
        operations:
        - operationobject: TRIGGER_PROTOTYPE
          operator: LIKE
          value: is down
          severity: DISASTER
      - name: S3 zone root check is Disaster
        step: '2'
        filter:
          evaltype: AND
          conditions:
          - macro: '{#SERVICE}'
            value: ^s3$
            formulaid: A
          - macro: '{#CHECK}'
            value: ^root$
            formulaid: B
        operations:
        - operationobject: TRIGGER_PROTOTYPE
          operator: LIKE
          value: is down
          severity: DISASTER
      filter:
        evaltype: AND
        conditions:
        - macro: '{#TARGET}'
          value: '{$OS_SKIP.HOST.NOT_MATCHES}'
          operator: NOT_MATCHES_REGEX
          formulaid: A
        - macro: '{#NODE}'
          value: '{$OS_SKIP.HOST.NOT_MATCHES}'
          operator: NOT_MATCHES_REGEX
          formulaid: B
    - uuid: f7b218a8290b4947be91bd1af2b35af0
      name: Service records
      type: DEPENDENT
      key: os.fast.discovery.agents
      delay: '0'
      lifetime: '{$OS_LLD.LIFETIME}'
      description: Nova / Cinder os-services, Manila services, Heat services, Magnum mservices, Ironic conductors. One row per binary@host. Heat duplicates per worker are merged (any live record wins).
      item_prototypes:
      - uuid: 3e520a2e9c2d40ce8c939d8126e63308
        name: '{#LABEL} {#BINARY} on {#HOST}: state'
        type: DEPENDENT
        key: os.agent.state["{#ID}"]
