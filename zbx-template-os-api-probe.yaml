    - name: 'OpenStack probe fast: script failing'
      expression: last(/OS-API-Probe/os.fast.collect_ok)=0
    tags:
    - tag: impact
      value: monitoring
    - tag: service
      value: monitoring
    - tag: component
      value: os-probe-fast
  - uuid: 25f02d6790224a0e93a2ebe7220c582e
    expression: min(/OS-API-Probe/os.mid.checks_deadline,#3)>0
    name: 'OpenStack probe mid: hitting its deadline'
    priority: WARNING
    description: Checks were skipped (http_status -1) because the run reached mid_deadline_ms. Raise the deadline in the ini or move checks to a slower tier.
    dependencies:
    - name: 'OpenStack probe mid: script failing'
      expression: last(/OS-API-Probe/os.mid.collect_ok)=0
    tags:
    - tag: impact
      value: monitoring
    - tag: service
      value: monitoring
    - tag: component
      value: os-probe-mid
  - uuid: 59b16b428be04acfa7b3680ec1ed4aef
    expression: nodata(/OS-API-Probe/os.mid.total_ms,{$OS_MID.NODATA})=1
