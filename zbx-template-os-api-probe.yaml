  triggers:
  - uuid: 6c536c2241524b4aa0eb51269f232176
    expression: last(/OS-API-Probe/os.fast.glance_stores)>=0 and last(/OS-API-Probe/os.fast.glance_stores)<max(/OS-API-Probe/os.fast.glance_stores,1h)
    name: 'OpenStack Glance: a store disappeared'
    priority: HIGH
    manual_close: 'YES'
    dependencies:
    - name: 'OpenStack probe fast: script failing'
      expression: last(/OS-API-Probe/os.fast.collect_ok)=0
    tags:
    - tag: service
      value: glance
    - tag: layer
      value: L3
    - tag: impact
      value: availability
    - tag: component
      value: stores
  - uuid: 4a8334e888084447bbfaf3e19130a027
    expression: count(/OS-API-Probe/os.fast.auth.status,#4,"eq","0")+count(/OS-API-Probe/os.fast.auth.status,#4,"ge","500")>=3
    name: 'OpenStack Keystone: cannot issue tokens (HTTP {ITEM.VALUE})'
    priority: DISASTER
    recovery_mode: RECOVERY_EXPRESSION
    recovery_expression: last(/OS-API-Probe/os.fast.auth.status)>=200 and last(/OS-API-Probe/os.fast.auth.status)<300
    opdata: HTTP {ITEM.LASTVALUE}
    description: 3 of the last 4 token requests got no response or 5xx. Keystone, its DB or memcached is down - every OpenStack API needs a token.
    dependencies:
    - name: 'OpenStack probe fast: script failing'
      expression: last(/OS-API-Probe/os.fast.collect_ok)=0
    - name: OpenStack probe host cannot reach any endpoint
      expression: last(/OS-API-Probe/os.fast.probe_net_down)=1
    tags:
    - tag: service
      value: keystone
    - tag: layer
      value: L3
    - tag: impact
      value: availability
    - tag: component
      value: token
    - tag: http_status
      value: '{ITEM.VALUE}'
  - uuid: 4592ef40c7f1429eb6286109f459708a
    expression: last(/OS-API-Probe/os.fast.catalog_services)>=0 and last(/OS-API-Probe/os.fast.catalog_services)<max(/OS-API-Probe/os.fast.catalog_services,1h)
    name: 'OpenStack Keystone: catalog lost a service'
    priority: HIGH
    manual_close: 'YES'
    description: Fewer services in the catalog than during the last hour. Clears by itself an hour after a planned removal, or close it manually.
    dependencies:
    - name: 'OpenStack probe fast: script failing'
      expression: last(/OS-API-Probe/os.fast.collect_ok)=0
    tags:
    - tag: service
      value: keystone
    - tag: layer
      value: L3
    - tag: impact
      value: availability
    - tag: component
      value: catalog
  - uuid: 4f0b57f62500441dad7a26bf195e56c1
    expression: min(/OS-API-Probe/os.fast.auth.ms,#3)>{$OS_AUTH.WARN}
    name: 'OpenStack Keystone: token issue is slow'
    priority: WARNING
    dependencies:
    - name: 'OpenStack Keystone: cannot issue tokens (HTTP {ITEM.VALUE})'
      expression: count(/OS-API-Probe/os.fast.auth.status,#4,"eq","0")+count(/OS-API-Probe/os.fast.auth.status,#4,"ge","500")>=3
      recovery_expression: last(/OS-API-Probe/os.fast.auth.status)>=200 and last(/OS-API-Probe/os.fast.auth.status)<300
    tags:
    - tag: service
      value: keystone
    - tag: layer
      value: L3
    - tag: impact
      value: stability
    - tag: component
      value: token
  - uuid: 17243f9e76da4650b32c28388ca618e1
    expression: last(/OS-API-Probe/os.mid.hv.schedulable)=0 and last(/OS-API-Probe/os.mid.hv.total)>0
    name: 'OpenStack Nova: no schedulable hypervisor left'
    priority: DISASTER
    description: Every hypervisor is down or disabled - new VMs cannot be scheduled anywhere in this AZ.
    dependencies:
    - name: 'OpenStack probe mid: script failing'
      expression: last(/OS-API-Probe/os.mid.collect_ok)=0
    tags:
    - tag: service
      value: nova
    - tag: layer
      value: L3
    - tag: impact
      value: availability
    - tag: component
      value: hypervisors
  - uuid: 869c52d2481647868f2ea318e4c6e747
    expression: last(/OS-API-Probe/os.slow.amp.cert_days)>=0 and last(/OS-API-Probe/os.slow.amp.cert_days)<{$OS_CERT.HIGH}
    name: 'OpenStack Octavia: amphora certificate expires in {ITEM.VALUE} days'
    priority: HIGH
    description: The soonest amphora cert expiry. Rotate before it lapses or the controller loses contact with the amphora.
    dependencies:
    - name: 'OpenStack probe slow: script failing'
      expression: last(/OS-API-Probe/os.slow.collect_ok)=0
    tags:
    - tag: service
      value: octavia
    - tag: layer
      value: L3
    - tag: impact
      value: stability
    - tag: component
