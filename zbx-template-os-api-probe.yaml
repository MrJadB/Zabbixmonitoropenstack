          - 1h
        master_item:
          key: os.probe.fast
        tags:
        - tag: service
          value: '{#SERVICE}'
        - tag: layer
          value: L3
        - tag: component
          value: '{#BINARY}'
        - tag: node
          value: '{#HOST}'
      trigger_prototypes:
      - uuid: b8a5b5f893a64c9493de13fcb2f11427
        expression: count(/OS-API-Probe/os.agent.state["{#ID}"],#3,"eq","0")>=3
        name: 'OpenStack {#LABEL}: {#BINARY} on {#HOST} is down'
        priority: HIGH
        recovery_mode: RECOVERY_EXPRESSION
        recovery_expression: last(/OS-API-Probe/os.agent.state["{#ID}"])<>0
        description: 'Service record reports down 3 rounds in a row (~5-6m). impact comes from the script: nova-compute = stability (one host), everything else = availability.'
        dependencies:
        - name: 'OpenStack probe fast: script failing'
          expression: last(/OS-API-Probe/os.fast.collect_ok)=0
        tags:
        - tag: service
          value: '{#SERVICE}'
        - tag: layer
          value: L3
        - tag: impact
          value: '{#IMPACT}'
        - tag: component
          value: '{#BINARY}'
        - tag: node
          value: '{#HOST}'
      - uuid: 30991ed3720d442abec66ffaad0fe1b8
        expression: last(/OS-API-Probe/os.agent.disabled["{#ID}"])=1
        name: 'OpenStack {#LABEL}: {#BINARY} on {#HOST} is disabled'
        priority: WARNING
        description: Disabled without "maintenance" in the reason, or forced_down. Use --disable-reason maintenance for planned work.
        dependencies:
        - name: 'OpenStack probe fast: script failing'
          expression: last(/OS-API-Probe/os.fast.collect_ok)=0
        tags:
        - tag: service
          value: '{#SERVICE}'
        - tag: layer
          value: L3
        - tag: impact
          value: stability
        - tag: component
          value: '{#BINARY}'
        - tag: node
          value: '{#HOST}'
      - uuid: f860dbdb0cc84c32b417738673bd16e0
        expression: min(/OS-API-Probe/os.agent.state["{#ID}"],{$OS_MAINT.STALE})=2 and max(/OS-API-Probe/os.agent.state["{#ID}"],{$OS_MAINT.STALE})=2
        name: 'OpenStack {#LABEL}: {#BINARY} on {#HOST} in maintenance longer than {$OS_MAINT.STALE}'
        priority: INFO
        tags:
        - tag: service
          value: '{#SERVICE}'
        - tag: layer
          value: L3
        - tag: impact
          value: stability
        - tag: component
          value: '{#BINARY}'
        - tag: node
          value: '{#HOST}'
      master_item:
        key: os.probe.fast
      lld_macro_paths:
      - lld_macro: '{#ID}'
        path: $.id
      - lld_macro: '{#SERVICE}'
        path: $.service
      - lld_macro: '{#LABEL}'
        path: $.label
      - lld_macro: '{#BINARY}'
        path: $.binary
      - lld_macro: '{#HOST}'
        path: $.host
      - lld_macro: '{#ZONE}'
        path: $.zone
      - lld_macro: '{#IMPACT}'
        path: $.impact
      preprocessing:
      - type: JSONPATH
        parameters:
        - $.agents
      - type: JAVASCRIPT
        parameters:
        - |-
          var a = JSON.parse(value), out = [];
          for (var i = 0; i < a.length; i++) {
            out.push({id: a[i].id, service: a[i].service, label: a[i].label, binary: a[i].binary, host: a[i].host, zone: a[i].zone, impact: a[i].impact});
          }
          return JSON.stringify(out);
      - type: DISCARD_UNCHANGED_HEARTBEAT
        parameters:
        - 1h
      filter:
        evaltype: AND
        conditions:
        - macro: '{#ZONE}'
          value: '{$OS_SKIP.AZ.NOT_MATCHES}'
          operator: NOT_MATCHES_REGEX
