  - uuid: d86d0b597d324558b8d6afd050411b91
    expression: count(/OS-API-Probe-Project/os.fast.auth.status,#4,"eq","0")+count(/OS-API-Probe-Project/os.fast.auth.status,#4,"ge","500")>=3
    name: 'OpenStack project Keystone: cannot issue tokens (HTTP {ITEM.VALUE})'
    priority: HIGH
    recovery_mode: RECOVERY_EXPRESSION
    recovery_expression: last(/OS-API-Probe-Project/os.fast.auth.status)>=200 and last(/OS-API-Probe-Project/os.fast.auth.status)<300
    opdata: HTTP {ITEM.LASTVALUE}
    description: 3 of the last 4 token requests of this project got no response or 5xx. The cloud-scope host raises the Disaster for Keystone itself.
    dependencies:
    - name: 'OpenStack project probe fast: script failing'
      expression: last(/OS-API-Probe-Project/os.fast.collect_ok)=0
    - name: OpenStack project probe host cannot reach any endpoint
      expression: last(/OS-API-Probe-Project/os.fast.probe_net_down)=1
    tags:
