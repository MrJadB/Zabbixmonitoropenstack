zabbix_export:
  version: '6.0'
  date: '2026-10-27T00:00:00Z'
  groups:
  - uuid: 64434e5f307a4d1ea6a34cb447f64166
    name: Templates/OpenStack
  templates:
  - uuid: ed541d4fe8c74933a07fbf86f9b6c8fd
    template: OS-API-Probe-Project
    name: OS-API-Probe-Project
    description: |
      OpenStack API monitoring of ONE project (scope = project) for Zabbix 6.0.

      DATA: os_probe.py (ini: scope = project) runs on the Zabbix proxy host from 3 systemd timers
      (os-probe-project@fast|mid|slow) and pushes one JSON per tier to a trapper master.
        os.probe.fast  every 2m   token, catalog, L3 functional probes of the project
        os.probe.mid   every 5m   heartbeat only (quota / resource counts off)
        os.probe.slow  every 30m  Glance canary, credential expiry

      Needs only a member or reader role in the project - no admin API, no policy change.

      SEPARATION FROM OS-API-Probe (cloud scope):
        every item and trigger has tag scope=project; set host tags scope=project and
        project=<name> and NO az tag, so cloud Services / SLAs (they need az=<AZ>) never count
        these problems. Never link this template and OS-API-Probe to the same host.

      STATUS: every check stores the real HTTP code. 0 = no response, -1 = skipped.
        0 or >= 500 -> impact=availability (project SLA), 400-499 -> impact=monitoring.
    groups:
    - name: Templates/OpenStack
    items:
    - uuid: f79aececa60942bcbdc1f72d53da97b2
      name: 'Probe fast: raw JSON'
      type: TRAP
      key: os.probe.fast
      history: '{$OS_PROBE.RAW.HISTORY}'
      trends: '0'
      value_type: TEXT
      description: |-
        Every {$OS_FAST.INTERVAL} by os-probe-project-fast.timer on the proxy host.
        Token, catalog, L3 functional probes of this project (L2 roots only with project_l2 = 1).
        Pushed by: os_probe.py --tier fast --send (ini: scope = project)
      tags:
      - tag: scope
        value: project
      - tag: service
        value: monitoring
      - tag: layer
        value: L3
      - tag: component
        value: os-probe-fast
    - uuid: c31967ff5d2b42eebaed389c5c0763a3
      name: 'Probe mid: raw JSON'
      type: TRAP
      key: os.probe.mid
      history: '{$OS_PROBE.RAW.HISTORY}'
      trends: '0'
      value_type: TEXT
      description: |-
        Every {$OS_MID.INTERVAL} by os-probe-project-mid.timer. Nothing project-specific
        by default (quota and resource counts are off); kept as a heartbeat.
        Pushed by: os_probe.py --tier mid --send (ini: scope = project)
      tags:
      - tag: scope
        value: project
      - tag: service
        value: monitoring
      - tag: layer
        value: L3
      - tag: component
        value: os-probe-mid
    - uuid: b42d9d3a712b4d8381ab42766e17767c
      name: 'Probe slow: raw JSON'
