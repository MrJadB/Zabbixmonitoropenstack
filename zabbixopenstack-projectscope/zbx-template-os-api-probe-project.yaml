      history: '{$OS_PROBE.RAW.HISTORY}'
      trends: '0'
      value_type: TEXT
      description: |-
        Every {$OS_SLOW.INTERVAL} by os-probe-project-slow.timer. Glance canary,
        credential expiry (TLS only with project_tls = 1).
        Pushed by: os_probe.py --tier slow --send (ini: scope = project)
      tags:
      - tag: scope
        value: project
      - tag: service
        value: monitoring
      - tag: layer
        value: L3
      - tag: component
        value: os-probe-slow
