      - uuid: 87ca1dd75275487b95f304bd15878b8f
        expression: last(/OS-API-Probe-Project/os.tls.days["{#ID}"])<>-1 and last(/OS-API-Probe-Project/os.tls.days["{#ID}"])<{$OS_TLS.WARN:"{#ID}"}
        name: OpenStack project TLS certificate {#ID} ({#LABEL}) expires in {ITEM.VALUE} days (warning)
        priority: WARNING
        opdata: '{ITEM.LASTVALUE}'
        dependencies:
        - name: OpenStack project TLS certificate {#ID} ({#LABEL}) expires in {ITEM.VALUE} days (average)
          expression: last(/OS-API-Probe-Project/os.tls.days["{#ID}"])<>-1 and last(/OS-API-Probe-Project/os.tls.days["{#ID}"])<{$OS_TLS.AVERAGE:"{#ID}"}
        tags:
        - tag: scope
          value: project
        - tag: service
          value: '{#SERVICE}'
        - tag: layer
          value: L2
        - tag: impact
          value: stability
        - tag: component
          value: tls_cert
        - tag: endpoint
          value: '{#ID}'
      master_item:
        key: os.probe.slow
      lld_macro_paths:
      - lld_macro: '{#ID}'
        path: $.id
      - lld_macro: '{#SERVICE}'
        path: $.service
      - lld_macro: '{#LABEL}'
        path: $.label
      - lld_macro: '{#HOST}'
        path: $.host
      - lld_macro: '{#PORT}'
        path: $.port
      preprocessing:
      - type: JSONPATH
        parameters:
        - $.tls_certs
      - type: JAVASCRIPT
        parameters:
        - |-
          var a = JSON.parse(value), out = [];
          for (var i = 0; i < a.length; i++) {
            out.push({id: a[i].id, service: a[i].service, label: a[i].label, host: a[i].host, port: a[i].port});
          }
          return JSON.stringify(out);
      - type: DISCARD_UNCHANGED_HEARTBEAT
        parameters:
        - 1h
    tags:
    - tag: scope
      value: project
    macros:
    - macro: '{$OS_API.ACCEPT}'
      value: '0'
      description: Extra 4xx code that is normal for one service. Context = service tag.
    - macro: '{$OS_AUTH.WARN}'
      value: '5000'
      description: Token issue time warning, ms (3 rounds).
    - macro: '{$OS_CRED.EXPIRE.WARN}'
      value: '14'
      description: Probe application credential expiry warning, days.
    - macro: '{$OS_FAST.INTERVAL}'
      value: 2m
      description: 'Documentation only: must match os-probe-project-fast.timer.'
    - macro: '{$OS_FAST.NODATA}'
      value: 10m
      description: nodata() window for the fast master.
    - macro: '{$OS_FAST.RUNTIME.WARN}'
      value: '30000'
      description: Warn when the fast run takes longer, ms.
    - macro: '{$OS_LATENCY.WARN}'
      value: '5000'
      description: API response time warning, ms (3 rounds). Context = service tag.
    - macro: '{$OS_LLD.LIFETIME}'
      value: 7d
      description: How long an undiscovered row survives.
    - macro: '{$OS_MID.INTERVAL}'
      value: 5m
      description: 'Documentation only: must match os-probe-project-mid.timer.'
    - macro: '{$OS_MID.NODATA}'
