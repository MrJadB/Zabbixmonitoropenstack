        expression: last(/OS-API-Probe-Project/os.tls.days["{#ID}"])<>-1 and last(/OS-API-Probe-Project/os.tls.days["{#ID}"])<{$OS_TLS.HIGH:"{#ID}"}
        name: OpenStack project TLS certificate {#ID} ({#LABEL}) expires in {ITEM.VALUE} days
        priority: HIGH
        opdata: '{ITEM.LASTVALUE}'
        dependencies:
        - name: 'OpenStack project probe slow: script failing'
          expression: last(/OS-API-Probe-Project/os.slow.collect_ok)=0
        tags:
        - tag: scope
          value: project
        - tag: service
          value: '{#SERVICE}'
        - tag: layer
          value: L2
        - tag: impact
          value: stability
        - tag: component
          value: tls_cert
        - tag: endpoint
          value: '{#ID}'
      - uuid: 6b197dd468c94cec96c664235877ed3f
        expression: last(/OS-API-Probe-Project/os.tls.days["{#ID}"])<>-1 and last(/OS-API-Probe-Project/os.tls.days["{#ID}"])<{$OS_TLS.AVERAGE:"{#ID}"}
        name: OpenStack project TLS certificate {#ID} ({#LABEL}) expires in {ITEM.VALUE} days (average)
        priority: AVERAGE
        opdata: '{ITEM.LASTVALUE}'
        dependencies:
        - name: OpenStack project TLS certificate {#ID} ({#LABEL}) expires in {ITEM.VALUE} days
          expression: last(/OS-API-Probe-Project/os.tls.days["{#ID}"])<>-1 and last(/OS-API-Probe-Project/os.tls.days["{#ID}"])<{$OS_TLS.HIGH:"{#ID}"}
        tags:
        - tag: scope
