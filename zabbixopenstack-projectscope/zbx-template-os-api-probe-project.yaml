      description: 'Documentation only: must match os-probe-project-slow.timer.'
    - macro: '{$OS_SLOW.NODATA}'
      value: 75m
      description: nodata() window for the slow master.
    - macro: '{$OS_SLOW.RUNTIME.WARN}'
      value: '240000'
      description: Warn when the slow run takes longer, ms.
    - macro: '{$OS_TLS.AVERAGE}'
      value: '7'
      description: TLS certificate expiry, days - Average (project_tls = 1 only).
    - macro: '{$OS_TLS.HIGH}'
      value: '3'
      description: TLS certificate expiry, days - High (project_tls = 1 only).
    - macro: '{$OS_TLS.WARN}'
      value: '30'
      description: TLS certificate expiry, days - Warning (project_tls = 1 only).
