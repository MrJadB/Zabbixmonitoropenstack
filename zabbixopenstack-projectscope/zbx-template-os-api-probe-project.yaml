    discovery_rules:
    - uuid: 47ab17ea30334c93a6521dcae0ef99a8
      name: API checks
      type: DEPENDENT
      key: os.fast.discovery.checks
      delay: '0'
      lifetime: '{$OS_LLD.LIFETIME}'
      description: 'One row per check: L3 functional probes of this project (catalog, servers, volumes, networks, images, stacks, load balancers ...). L2 roots appear only with project_l2 = 1.'
      item_prototypes:
      - uuid: d53db47cc0f74d36be773f2a3fc2670e
        name: '{#LABEL} {#CHECK} @ {#TARGET}: HTTP status'
        type: DEPENDENT
        key: os.api.status["{#ID}"]
        delay: '0'
        history: 31d
        trends: '0'
        value_type: FLOAT
        description: Real HTTP code. 0 = no response, -1 = skipped (deadline, skip_types, no token).
        valuemap:
          name: HTTP status
        preprocessing:
        - type: JSONPATH
          parameters:
          - $.checks[?(@.id=='{#ID}')].http_status.first()
        master_item:
          key: os.probe.fast
        tags:
        - tag: scope
