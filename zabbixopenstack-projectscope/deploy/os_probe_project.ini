[DEFAULT]
scope = project
zabbix_server = 127.0.0.1
zabbix_port = 10051
iface = internal
ca_file =
http_timeout_ms = 10000
fast_deadline_ms = 40000
mid_deadline_ms = 120000
slow_deadline_ms = 300000
workers = 4
stuck_minutes = 60
list_cap = 1000
project_l2 = 0
project_tls = 0
ref_url = http://GATEWAY-OR-ZABBIX/

[demo]
zabbix_host = OpenStack project demo
auth_url = http://INTERNAL-VIP:5000
# --- Authentication Option 1: Application Credential (recommended) ---
# Application credential created INSIDE project by a user with the member
#cred_id = CHANGE-ME
#cred_secret = CHANGE-ME

# --- Authentication Option 2: OpenStack User Password (alternative) ---
# If using username/password, comment out cred_id/cred_secret above and uncomment below:
username = demo_user
password = CHANGE-ME
user_domain_name = Default
project_name = demo
project_domain_name = Default
# tiny image visible to this project (empty = no canary).
canary_id =
# services not checked at all
skip_types = swift
skip_checks = pools
catalog_cache = /var/lib/zabbix/os_probe_project_<project_name>.catalog.json

s3_region = NCP-TH
s3_access_key = <s3_access_key>
s3_secret_key = <s3_secret_key>
s3_zones = bkk,non
s3_bkk_url = https://s3-bkk.<url>.org
s3_bkk_bucket = zbx-monitor-bkk
s3_bkk_static_url =
s3_non_url = https://s3-non.<url>.org
s3_non_bucket = zbx-monitor-non
s3_non_static_url =

# [another-project]
# zabbix_host = OpenStack project another-project
# auth_url = http://INTERNAL-VIP:5000
# cred_id = CHANGE-ME
# cred_secret = CHANGE-ME
# catalog_cache = /var/lib/zabbix/os_probe_project_another-project.catalog.json
