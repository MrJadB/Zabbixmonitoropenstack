zabbix_export:
  version: '6.0'
  date: '2026-10-21T00:00:00Z'
  groups:
  - uuid: 98572aa9d8a14015a12356dbee9e6295
    name: Templates/OpenStack
  templates:
  - uuid: c3b97286c81d4a3cbbd3ddd5f01456ef
    template: OS-Deps-Node-api
    name: OS-Deps-Node-api
    description: |-
      L4 dependencies seen from each controller. Link to every controller host (Zabbix agent 2).
      
        MariaDB Galera   agent 2 MySQL plugin: wsrep_* status, connections
        memcached        agent 2 Memcached plugin
        keepalived VIP   /proc/net/fib_trie: is the VIP local on this node (OS-Deps-Cluster sums it)
        Octavia HM       net.udp.listen on the health-manager port
      
      Kolla binds MariaDB and memcached to the API interface, not localhost: the host interface IP
      ({HOST.CONN}) must be the node's API IP.
      
      DB user (read-only is enough):
        CREATE USER 'zbx_monitor'@'%' IDENTIFIED BY '<pw>';
        GRANT USAGE, REPLICATION CLIENT, PROCESS, SHOW DATABASES, SHOW VIEW ON *.* TO 'zbx_monitor'@'%';
      
      Tags: service / layer=L4 / impact / component / node. Set host tag az=<AZ>.
    groups:
    - name: Templates/OpenStack
    items:
    - uuid: 866ce0611cfd449d95ff1ecdbbd3dbf2
      name: 'MariaDB: ping'
      key: 'mysql.ping["tcp://{HOST.CONN}:{$MYSQL.PORT}","{$MYSQL.USER}","{$MYSQL.PASSWORD}"]'
      delay: 1m
      history: 31d
      valuemap:
        name: Service state
      tags:
      - tag: service
        value: mariadb
      - tag: layer
        value: L4
      - tag: component
        value: galera
    - uuid: 5bb7fd6f5a0446e79d44a7b25c26e53c
      name: 'MariaDB: status variables (raw)'
      key: 'mysql.get_status_variables["tcp://{HOST.CONN}:{$MYSQL.PORT}","{$MYSQL.USER}","{$MYSQL.PASSWORD}"]'
      delay: 1m
      history: '0'
      trends: '0'
      value_type: TEXT
      description: 'SHOW GLOBAL STATUS as JSON. Not stored; dependents read it.'
      tags:
      - tag: service
        value: mariadb
      - tag: layer
        value: L4
      - tag: component
        value: galera
    - uuid: 8b7c4e7df11e4fc7b567b85ed07a350b
      name: 'Galera: ready'
      type: DEPENDENT
      key: galera.ready
      delay: '0'
      history: 31d
      valuemap:
        name: Yes/No
      preprocessing:
      - type: JSONPATH
        parameters:
        - $.wsrep_ready
      - type: JAVASCRIPT
        parameters:
        - 'return (value === ''true'' || value === true || value === ''ON'' || value === ''1'') ? 1 : 0;'
      master_item:
        key: 'mysql.get_status_variables["tcp://{HOST.CONN}:{$MYSQL.PORT}","{$MYSQL.USER}","{$MYSQL.PASSWORD}"]'
      tags:
      - tag: service
        value: mariadb
      - tag: layer
        value: L4
      - tag: component
        value: galera
    - uuid: b34d99a8f8cd4715b82c11098eda7daa
      name: 'Galera: cluster status'
      type: DEPENDENT
      key: galera.cluster_status
      delay: '0'
      history: 7d
      trends: '0'
      value_type: CHAR
      preprocessing:
      - type: JSONPATH
        parameters:
        - $.wsrep_cluster_status
      - type: DISCARD_UNCHANGED_HEARTBEAT
        parameters:
        - 1h
      master_item:
        key: 'mysql.get_status_variables["tcp://{HOST.CONN}:{$MYSQL.PORT}","{$MYSQL.USER}","{$MYSQL.PASSWORD}"]'
      tags:
      - tag: service
        value: mariadb
      - tag: layer
        value: L4
      - tag: component
        value: galera
    - uuid: 4e639fa3038f4b91b4cfd445c5fa0d66
      name: 'Galera: primary component'
      type: DEPENDENT
      key: galera.primary
      delay: '0'
      history: 31d
      valuemap:
