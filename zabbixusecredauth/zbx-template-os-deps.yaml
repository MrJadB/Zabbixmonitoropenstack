  - uuid: adc24a13717d4dc3bc29cf9a215fed56
    template: OS-Host
    name: OS-Host
    description: |-
      Minimal host checks for OpenStack controllers and computes (Zabbix agent, passive).
      Clock, file systems, agent availability. Docker containers (L1) are out of scope by decision.
      
      Disk uses vfs.fs.discovery instead of fixed paths: /var/lib/docker is mode 710 root, so the agent
      cannot stat paths below it. MariaDB / RabbitMQ data live in docker volumes on whichever file
      system holds /var/lib/docker - that file system is discovered and alarmed.
    groups:
    - name: Templates/OpenStack
    items:
    - uuid: f86ed367cfd545f1bc6745c5668e7995
      name: 'Zabbix agent: ping'
      key: agent.ping
      delay: 1m
      history: 31d
      valuemap:
        name: Yes/No
      tags:
      - tag: service
        value: host
      - tag: component
        value: agent
    - uuid: 98a6824a33e24a3da80b533283f6fdbf
      name: 'System: local time'
      key: system.localtime
      delay: 1m
      history: 31d
      units: unixtime
      tags:
      - tag: service
        value: chrony
      - tag: component
        value: clock
    - uuid: c246f85879494e76bb9c6097df41aad3
      name: 'File systems: /proc/mounts (raw)'
      key: vfs.file.contents[/proc/mounts]
      delay: 1m
      history: '0'
      trends: '0'
      value_type: TEXT
      tags:
      - tag: service
        value: host
      - tag: component
        value: disk
    discovery_rules:
    - uuid: f03c6eaace0d452f8a9fab50ceaf54a0
      name: File systems
      key: vfs.fs.discovery
      delay: 1h
      lifetime: 7d
      filter:
        evaltype: AND
        conditions:
        - macro: '{#FSTYPE}'
          value: '{$VFS.FSTYPE.MATCHES}'
          formulaid: A
        - macro: '{#FSNAME}'
          value: '{$VFS.FSNAME.NOT_MATCHES}'
          operator: NOT_MATCHES_REGEX
          formulaid: B
      item_prototypes:
      - uuid: 1e7267a3d3a545e99250b3abd728511e
        name: '{#FSNAME}: space used'
        key: 'vfs.fs.size[{#FSNAME},pused]'
        delay: 5m
        history: 31d
        value_type: FLOAT
        units: '%'
        tags:
        - tag: service
          value: host
        - tag: component
          value: disk
        - tag: fs
          value: '{#FSNAME}'
      - uuid: 2586cb3de5c340668fe25cd87aebbbb5
        name: '{#FSNAME}: total space'
        key: 'vfs.fs.size[{#FSNAME},total]'
        delay: 1h
        history: 31d
        units: B
        tags:
        - tag: service
          value: host
        - tag: component
          value: disk
        - tag: fs
          value: '{#FSNAME}'
      - uuid: 947413da6d5b42e58772984b964af85c
        name: '{#FSNAME}: read-only'
        type: DEPENDENT
        key: vfs.fs.readonly[{#FSNAME}]
        delay: '0'
        history: 31d
        description: '1 = mounted read-only (ro in /proc/mounts), usually after an I/O error.'
        valuemap:
          name: Yes/No
        preprocessing:
        - type: JAVASCRIPT
          parameters:
          - |-
              var mp = '{#FSNAME}', lines = value.split('\n');
              for (var i = 0; i < lines.length; i++) {
                var p = lines[i].split(' ');
                if (p[1] === mp && p[3]) {
                  var opts = p[3].split(',');
                  for (var j = 0; j < opts.length; j++) { if (opts[j] === 'ro') { return 1; } }
                  return 0;
                }
              }
              return 0;
        master_item:
          key: vfs.file.contents[/proc/mounts]
        tags:
        - tag: service
          value: host
        - tag: component
          value: disk
        - tag: fs
          value: '{#FSNAME}'
      trigger_prototypes:
      - uuid: e0fa094a40694db4b002be2ed59328d2
        expression: 'last(/OS-Host/vfs.fs.size[{#FSNAME},pused])>{$VFS.PUSED.HIGH}'
        name: '{HOST.NAME}: {#FSNAME} above {$VFS.PUSED.HIGH}% used'
        priority: HIGH
        opdata: '{ITEM.LASTVALUE}'
        tags:
        - tag: service
          value: host
        - tag: impact
          value: capacity
        - tag: component
          value: '{#FSNAME}'
        - tag: node
          value: '{HOST.NAME}'
      - uuid: fe6a399d0a4a4a0793c5043e58205639
        expression: 'last(/OS-Host/vfs.fs.size[{#FSNAME},pused])>{$VFS.PUSED.WARN}'
        name: '{HOST.NAME}: {#FSNAME} above {$VFS.PUSED.WARN}% used'
        priority: WARNING
        opdata: '{ITEM.LASTVALUE}'
        dependencies:
        - name: '{HOST.NAME}: {#FSNAME} above {$VFS.PUSED.HIGH}% used'
          expression: 'last(/OS-Host/vfs.fs.size[{#FSNAME},pused])>{$VFS.PUSED.HIGH}'
        tags:
        - tag: service
          value: host
        - tag: impact
          value: capacity
        - tag: component
          value: '{#FSNAME}'
        - tag: node
          value: '{HOST.NAME}'
      - uuid: e339ca0dfb3d48d9ae75e7d525284e8c
        expression: last(/OS-Host/vfs.fs.readonly[{#FSNAME}])=1
        name: '{HOST.NAME}: {#FSNAME} is mounted read-only'
        priority: HIGH
        description: 'Filesystem remounted read-only (disk or storage I/O error): containers and VMs on this mount cannot write.'
        tags:
        - tag: service
          value: host
        - tag: impact
          value: stability
        - tag: component
          value: '{#FSNAME}'
        - tag: node
          value: '{HOST.NAME}'
    macros:
    - macro: '{$AGENT.NODATA}'
      value: 5m
      description: agent.ping nodata window.
    - macro: '{$TIME.MAX.DIFF}'
      value: '60'
      description: 'Allowed clock difference with the Zabbix server, seconds.'
    - macro: '{$VFS.FSNAME.NOT_MATCHES}'
      value: ^(/dev|/sys|/run|/proc|/boot/efi|/var/lib/docker/.+|/snap/.+)
      description: 'Mount points to skip (container overlays, pseudo file systems).'
    - macro: '{$VFS.FSTYPE.MATCHES}'
      value: ^(ext4|xfs|btrfs|zfs)$
      description: File system types to discover.
    - macro: '{$VFS.PUSED.HIGH}'
      value: '90'
      description: 'File system used, % - High.'
    - macro: '{$VFS.PUSED.WARN}'
      value: '80'
      description: 'File system used, % - Warning.'
    valuemaps:
    - uuid: 4dda1a73f52e46dbabf37e54f1c9635a
      name: Yes/No
      mappings:
      - value: '0'
        newvalue: 'No'
      - value: '1'
        newvalue: 'Yes'
  - uuid: 883b9d49384944e88b4e1e7c1f58a98d
    template: OS-Proxy-Watch
    name: OS-Proxy-Watch
    description: |-
      Is the AZ proxy still sending data? Internal check - the host this
      template is linked to MUST be monitored by the Zabbix server, not by the proxy it watches.
      One host per proxy, or link it once per proxy with {$PROXY.NAME} set on each host.
