          value: '{#SVNAME}'
      trigger_prototypes:
      - uuid: 84f20ad21bd04fe6a5c563d331552330
        expression: 'count(/OS-Deps-Cluster/haproxy.server.state["{#ID}"],#5,"eq","0")>=5'
        name: 'HAProxy {#PXNAME}: server {#SVNAME} is DOWN'
        priority: WARNING
        recovery_mode: RECOVERY_EXPRESSION
        recovery_expression: 'last(/OS-Deps-Cluster/haproxy.server.state["{#ID}"])=1'
        description: 'One backend server failed its HAProxy health check; other servers still take traffic.'
        tags:
        - tag: service
          value: haproxy
        - tag: layer
          value: L4
        - tag: impact
          value: stability
        - tag: component
          value: '{#PXNAME}'
        - tag: node
          value: '{#SVNAME}'
      master_item:
        key: haproxy.stats.json
      lld_macro_paths:
      - lld_macro: '{#ID}'
        path: $.id
      - lld_macro: '{#PXNAME}'
        path: $.pxname
      - lld_macro: '{#SVNAME}'
        path: $.svname
      preprocessing:
      - type: JSONPATH
        parameters:
        - $.servers
      - type: JAVASCRIPT
        parameters:
        - |-
            var a = JSON.parse(value), out = [];
            for (var i = 0; i < a.length; i++) {
              out.push({id: a[i].id, pxname: a[i].pxname, svname: a[i].svname});
            }
            return JSON.stringify(out);
      - type: DISCARD_UNCHANGED_HEARTBEAT
        parameters:
        - 1h
    macros:
    - macro: '{$HAPROXY.BACKEND.MATCHES}'
      value: .*
      description: Regex of HAProxy backends to discover.
    - macro: '{$HAPROXY.BACKEND.NOT_MATCHES}'
      value: (?i)(^$|_cell_kkn_|_kkn_back$|^kkn_)
      description: 'Regex of HAProxy backends to skip (e.g. unprovisioned AZs/cells like kkn).'
    - macro: '{$HAPROXY.INTERVAL}'
      value: 1m
      description: HAProxy stats poll interval.
    - macro: '{$HAPROXY.PASSWORD}'
      type: SECRET_TEXT
      description: HAProxy stats password (haproxy_stats_password in passwords.yml). Secret text.
    - macro: '{$HAPROXY.SERVER.NOT_MATCHES}'
      value: (?i)(^$|^kkn-|_kkn_)
      description: 'Regex of HAProxy backend servers to skip (e.g. unprovisioned AZs/nodes).'
    - macro: '{$HAPROXY.SESS.WARN}'
      value: '80'
      description: 'HAProxy backend session usage warning, %.'
    - macro: '{$HAPROXY.STATS.URL}'
      value: 'http://INTERNAL-VIP:1984/;csv'
      description: HAProxy stats CSV URL (Kolla uses port 1984).
    - macro: '{$HAPROXY.USERNAME}'
      value: stats
      description: 'HAProxy stats basic-auth username (Kolla default: stats).'
    - macro: '{$OS_CTL.GROUP}'
      value: OpenStack/CHANGE-ME/Controllers
      description: 'Host group of this AZ''s controllers (linked to OS-Deps-Node). Used by the VIP sum.'
    - macro: '{$RABBITMQ.API.URL}'
      value: http://INTERNAL-VIP:15672
      description: RabbitMQ management API via the internal VIP.
    - macro: '{$RABBITMQ.FD.WARN}'
      value: '80'
      description: 'File descriptor / socket warning, %.'
    - macro: '{$RABBITMQ.INTERVAL}'
      value: 1m
      description: Poll interval of the 3 API calls.
    - macro: '{$RABBITMQ.NODATA}'
      value: 5m
      description: nodata() window for the management API.
    - macro: '{$RABBITMQ.PASSWORD}'
      type: SECRET_TEXT
      description: Secret text.
    - macro: '{$RABBITMQ.QUEUE.MATCH}'
      value: ^(conductor|scheduler|cinder-scheduler|cinder-volume|cinder-backup|engine|magnum-conductor|octavia_prov|trove-conductor|trove-taskmanager|manila-scheduler|manila-share)$
      description: Regex of OpenStack RPC queues to watch (server-side filter).
    - macro: '{$RABBITMQ.QUEUE.MSG.WARN}'
      value: '1000'
      description: Messages waiting warning. Context = queue name.
    - macro: '{$RABBITMQ.UNACKED.WARN}'
      value: '500'
      description: Cluster-wide unacknowledged messages warning.
    - macro: '{$RABBITMQ.USERNAME}'
      value: zbx_monitor
      description: User with the monitoring tag.
    - macro: '{$RABBITMQ.VHOST}'
      value: '%2F'
      description: URL-encoded vhost. Kolla uses /.
