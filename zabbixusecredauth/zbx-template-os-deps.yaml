        - $.Threads_connected
      master_item:
        key: 'mysql.get_status_variables["tcp://{HOST.CONN}:{$MYSQL.PORT}","{$MYSQL.USER}","{$MYSQL.PASSWORD}"]'
      tags:
      - tag: service
        value: mariadb
      - tag: layer
        value: L4
      - tag: component
        value: galera
    - uuid: 92baf1e3401b48e39f4bbb8e2368a2fb
      name: 'MariaDB: max used connections'
      type: DEPENDENT
      key: mysql.max_used_connections
      delay: '0'
      history: 31d
      value_type: FLOAT
      preprocessing:
      - type: JSONPATH
        parameters:
        - $.Max_used_connections
      master_item:
        key: 'mysql.get_status_variables["tcp://{HOST.CONN}:{$MYSQL.PORT}","{$MYSQL.USER}","{$MYSQL.PASSWORD}"]'
      tags:
      - tag: service
        value: mariadb
      - tag: layer
        value: L4
      - tag: component
        value: galera
    - uuid: a4f357e6f3b64ee6b1379ac854548d8e
      name: 'memcached: ping'
      key: 'memcached.ping["tcp://{HOST.CONN}:{$MEMCACHED.PORT}"]'
      delay: 1m
      history: 31d
      valuemap:
        name: Service state
      tags:
      - tag: service
        value: memcached
      - tag: layer
        value: L4
      - tag: component
