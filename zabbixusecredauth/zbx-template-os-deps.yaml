    - uuid: 1f68c682c24b43d9af4ee6d0427d5643
      name: 'memcached: stats (raw)'
      key: 'memcached.stats["tcp://{HOST.CONN}:{$MEMCACHED.PORT}"]'
      delay: 1m
      history: '0'
      trends: '0'
      value_type: TEXT
      tags:
      - tag: service
        value: memcached
      - tag: layer
        value: L4
      - tag: component
        value: memcached
    - uuid: 866627b790bb483faf398d7c43a2e054
      name: 'memcached: get hits (cumulative)'
      type: DEPENDENT
      key: memcached.get_hits
      delay: '0'
      history: 31d
      value_type: FLOAT
      preprocessing:
      - type: JSONPATH
        parameters:
        - $.get_hits
      master_item:
        key: 'memcached.stats["tcp://{HOST.CONN}:{$MEMCACHED.PORT}"]'
      tags:
      - tag: service
        value: memcached
      - tag: layer
        value: L4
      - tag: component
        value: memcached
    - uuid: 08743664964d45809406bb57ef4d7aee
      name: 'memcached: get misses (cumulative)'
      type: DEPENDENT
      key: memcached.get_misses
      delay: '0'
      history: 31d
      value_type: FLOAT
      preprocessing:
      - type: JSONPATH
        parameters:
        - $.get_misses
      master_item:
        key: 'memcached.stats["tcp://{HOST.CONN}:{$MEMCACHED.PORT}"]'
      tags:
      - tag: service
        value: memcached
      - tag: layer
        value: L4
      - tag: component
        value: memcached
    - uuid: 08e9b1a0a5944fa08db81a5882db9608
      name: 'memcached: evictions (cumulative)'
      type: DEPENDENT
      key: memcached.evictions
      delay: '0'
      history: 31d
      value_type: FLOAT
      preprocessing:
      - type: JSONPATH
        parameters:
        - $.evictions
      master_item:
        key: 'memcached.stats["tcp://{HOST.CONN}:{$MEMCACHED.PORT}"]'
      tags:
      - tag: service
        value: memcached
      - tag: layer
        value: L4
      - tag: component
        value: memcached
    - uuid: 1a44e758211e4f71bbbf81555771b537
      name: 'memcached: current connections'
      type: DEPENDENT
      key: memcached.curr_connections
      delay: '0'
      history: 31d
      value_type: FLOAT
      preprocessing:
      - type: JSONPATH
        parameters:
        - $.curr_connections
      master_item:
        key: 'memcached.stats["tcp://{HOST.CONN}:{$MEMCACHED.PORT}"]'
      tags:
      - tag: service
        value: memcached
      - tag: layer
        value: L4
      - tag: component
        value: memcached
    - uuid: 883acc06ac43482c84008ed6a9f4031a
      name: 'memcached: max connections'
      type: DEPENDENT
      key: memcached.max_connections
      delay: '0'
      history: 31d
      value_type: FLOAT
      preprocessing:
      - type: JSONPATH
        parameters:
        - $.max_connections
      master_item:
        key: 'memcached.stats["tcp://{HOST.CONN}:{$MEMCACHED.PORT}"]'
      tags:
      - tag: service
        value: memcached
      - tag: layer
        value: L4
      - tag: component
        value: memcached
    - uuid: c919846fb43144dcaea0701eb05c9e00
      name: 'memcached: hit ratio'
      type: CALCULATED
      key: memcached.hit_ratio
      delay: 1m
      history: 31d
      value_type: FLOAT
      units: '%'
      params: '100*(last(//memcached.get_hits)-last(//memcached.get_hits,#2))/(last(//memcached.get_hits)-last(//memcached.get_hits,#2)+last(//memcached.get_misses)-last(//memcached.get_misses,#2)+1)'
      description: Over the last minute. +1 in the divisor keeps an idle minute from dividing by 0.
      tags:
      - tag: service
        value: memcached
      - tag: layer
        value: L4
      - tag: component
        value: memcached
    - uuid: fd4f44ac804247da9d4fbbf20460513c
      name: 'keepalived: routing table (raw)'
      key: vfs.file.contents[/proc/net/fib_trie]
      delay: 1m
      history: '0'
      trends: '0'
      value_type: TEXT
      description: 'World-readable, no sudo. Local addresses show as "/32 host LOCAL".'
      tags:
      - tag: service
        value: keepalived
      - tag: layer
        value: L4
      - tag: component
        value: vip
    - uuid: 46c9d3cbe8194b4392f497a21cb2d44a
      name: 'keepalived: internal VIP on this node'
      type: DEPENDENT
      key: os.vip.present[internal]
      delay: '0'
      history: 31d
      description: Summed across controllers by OS-Deps-Cluster. Empty macro = not supported (skipped by the sum).
      valuemap:
        name: Yes/No
      preprocessing:
      - type: JAVASCRIPT
        parameters:
        - |-
            var vip = '{$OS_VIP.INTERNAL}';
            if (!vip) { throw 'VIP macro is empty - item disabled on purpose'; }
            var lines = value.split('\n');
            for (var i = 0; i < lines.length - 1; i++) {
              if (lines[i].replace(/^[\s|+`-]+/, '') === vip && /\/32 host LOCAL/.test(lines[i + 1])) {
                return 1;
              }
            }
            return 0;
      master_item:
        key: vfs.file.contents[/proc/net/fib_trie]
      tags:
      - tag: service
        value: keepalived
      - tag: layer
        value: L4
      - tag: component
        value: vip
    - uuid: c057ce1ef81c48be9687167c80ad9bfa
      name: 'keepalived: external VIP on this node'
      type: DEPENDENT
      key: os.vip.present[external]
      delay: '0'
      history: 31d
      valuemap:
        name: Yes/No
      preprocessing:
      - type: JAVASCRIPT
        parameters:
        - |-
            var vip = '{$OS_VIP.EXTERNAL}';
            if (!vip) { throw 'VIP macro is empty - item disabled on purpose'; }
            var lines = value.split('\n');
            for (var i = 0; i < lines.length - 1; i++) {
              if (lines[i].replace(/^[\s|+`-]+/, '') === vip && /\/32 host LOCAL/.test(lines[i + 1])) {
                return 1;
              }
            }
            return 0;
      master_item:
        key: vfs.file.contents[/proc/net/fib_trie]
      tags:
      - tag: service
        value: keepalived
      - tag: layer
        value: L4
      - tag: component
        value: vip
    - uuid: e906b51497a249779144aabff318a2de
      name: 'Octavia health manager: UDP listening'
      key: net.udp.listen[{$OCTAVIA.HM.PORT}]
      delay: 1m
      history: 31d
      description: Amphorae send heartbeats here. Disable this item on nodes without octavia_health_manager.
      valuemap:
        name: Yes/No
      tags:
      - tag: service
        value: octavia
      - tag: layer
        value: L4
      - tag: component
        value: health-manager
    macros:
    - macro: '{$GALERA.FLOW.WARN}'
      value: '0.1'
      description: Flow control paused ratio warning (0-1).
    - macro: '{$GALERA.RECVQ.WARN}'
      value: '100'
      description: Receive queue warning.
    - macro: '{$GALERA.SIZE}'
      value: '3'
      description: Expected Galera cluster size.
    - macro: '{$MEMCACHED.CONN.WARN}'
      value: '90'
      description: 'Connections warning, % of max_connections.'
    - macro: '{$MEMCACHED.EVICT.MAX}'
      value: '0'
      description: Evictions per minute allowed.
    - macro: '{$MEMCACHED.PORT}'
      value: '11211'
      description: memcached port on the API interface.
    - macro: '{$MYSQL.CONN.WARN}'
      value: '80'
      description: 'Connections warning, % of {$MYSQL.MAX_CONN}.'
    - macro: '{$MYSQL.MAX_CONN}'
      value: '10000'
      description: MariaDB max_connections (Kolla default 10000).
    - macro: '{$MYSQL.PASSWORD}'
      type: SECRET_TEXT
      description: Set on the host or a host group. Secret text.
    - macro: '{$MYSQL.PORT}'
      value: '3306'
      description: MariaDB port on the API interface.
    - macro: '{$MYSQL.USER}'
      value: zbx_monitor
      description: Read-only monitoring user (see template description).
    - macro: '{$OCTAVIA.HM.PORT}'
      value: '5555'
      description: octavia health manager UDP port.
    - macro: '{$OS_VIP.EXTERNAL}'
      value: ''
      description: kolla_external_vip_address. Empty = not checked.
    - macro: '{$OS_VIP.INTERNAL}'
      value: ''
      description: kolla_internal_vip_address of this AZ. Set on the host group.
    valuemaps:
    - uuid: 02eb2ac096ad48cfa95182220bba517f
      name: Service state
      mappings:
      - value: '0'
        newvalue: Down
      - value: '1'
        newvalue: Up
    - uuid: 538b5b4f4a74468480f0ce2bf1b16b96
      name: Yes/No
      mappings:
      - value: '0'
        newvalue: 'No'
      - value: '1'
        newvalue: 'Yes'
  - uuid: 7e60fe757526452494498f6b4d65992e
    template: OS-Deps-Cluster
    name: OS-Deps-Cluster
    description: |-
      L4 cluster-wide checks. Link to the AZ host (the same host as OS-API-Probe).
      
        RabbitMQ   management API via the internal VIP (Kolla publishes rabbitmq_management on 15672):
                   nodes, partitions, alarms, fd/sockets, queues with no consumers (regex-filtered
                   server-side, never the full /api/queues)
        keepalived how many controllers hold the VIP (sum of OS-Deps-Node items in {$OS_CTL.GROUP})
      
      RabbitMQ user: rabbitmqctl add_user zbx_monitor <pw>; set_user_tags zbx_monitor monitoring;
      set_permissions -p / zbx_monitor '' '' '.*'
    groups:
    - name: Templates/OpenStack
    items:
    - uuid: ee562eb802fd45f785d40760ec0a2e87
      name: 'RabbitMQ: nodes (raw)'
      type: HTTP_AGENT
      key: rabbitmq.nodes.raw
      delay: '{$RABBITMQ.INTERVAL}'
      history: '0'
      trends: '0'
      value_type: TEXT
      url: '{$RABBITMQ.API.URL}/api/nodes'
      authtype: BASIC
      username: '{$RABBITMQ.USERNAME}'
      password: '{$RABBITMQ.PASSWORD}'
      timeout: 10s
      query_fields:
      - name: columns
        value: 'name,running,mem_alarm,disk_free_alarm,fd_used,fd_total,sockets_used,sockets_total,partitions'
      tags:
      - tag: service
        value: rabbitmq
      - tag: layer
        value: L4
      - tag: component
        value: rabbitmq
    - uuid: 7038be09aacb4d38bff883e76e0c57b5
      name: 'RabbitMQ: overview (raw)'
      type: HTTP_AGENT
      key: rabbitmq.overview.raw
      delay: '{$RABBITMQ.INTERVAL}'
      history: '0'
      trends: '0'
      value_type: TEXT
      url: '{$RABBITMQ.API.URL}/api/overview'
      authtype: BASIC
      username: '{$RABBITMQ.USERNAME}'
      password: '{$RABBITMQ.PASSWORD}'
      timeout: 10s
      query_fields:
      - name: columns
        value: 'cluster_name,queue_totals,object_totals'
      tags:
      - tag: service
        value: rabbitmq
      - tag: layer
        value: L4
      - tag: component
        value: rabbitmq
    - uuid: a65de97e2ecf4eac8e67d318b8439839
      name: 'RabbitMQ: OpenStack queues (raw)'
      type: HTTP_AGENT
      key: rabbitmq.queues.raw
      delay: '{$RABBITMQ.INTERVAL}'
      history: '0'
      trends: '0'
      value_type: TEXT
      url: '{$RABBITMQ.API.URL}/api/queues/{$RABBITMQ.VHOST}'
      authtype: BASIC
      username: '{$RABBITMQ.USERNAME}'
      password: '{$RABBITMQ.PASSWORD}'
      timeout: 10s
      query_fields:
      - name: page
        value: '1'
      - name: page_size
        value: '500'
      - name: name
        value: '{$RABBITMQ.QUEUE.MATCH}'
      - name: use_regex
        value: 'true'
      - name: columns
        value: 'name,consumers,messages'
      tags:
      - tag: service
        value: rabbitmq
      - tag: layer
        value: L4
      - tag: component
        value: rabbitmq
    - uuid: 850ccff7856b4883a56c926712fea36d
      name: 'RabbitMQ: nodes total'
      type: DEPENDENT
      key: rabbitmq.nodes.total
      delay: '0'
      history: 31d
      preprocessing:
      - type: JAVASCRIPT
        parameters:
        - 'return JSON.parse(value).length;'
      master_item:
        key: rabbitmq.nodes.raw
      tags:
      - tag: service
        value: rabbitmq
      - tag: layer
        value: L4
      - tag: component
        value: rabbitmq
    - uuid: 30130d935c23476487c1182966f7ee73
      name: 'RabbitMQ: nodes running'
      type: DEPENDENT
      key: rabbitmq.nodes.running
      delay: '0'
      history: 31d
      preprocessing:
      - type: JAVASCRIPT
        parameters:
        - |-
            var a = JSON.parse(value), n = 0;
            for (var i = 0; i < a.length; i++) { if (a[i].running) { n++; } }
            return n;
      master_item:
        key: rabbitmq.nodes.raw
      tags:
      - tag: service
        value: rabbitmq
      - tag: layer
        value: L4
      - tag: component
        value: rabbitmq
    - uuid: b06586f8359c49179aac6448c79febee
      name: 'RabbitMQ: network partitions'
