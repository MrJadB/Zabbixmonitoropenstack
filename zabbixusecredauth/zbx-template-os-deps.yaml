      name: 'Galera: synced'
      type: DEPENDENT
      key: galera.synced
      delay: '0'
      history: 31d
      valuemap:
        name: Yes/No
      preprocessing:
      - type: JSONPATH
        parameters:
        - $.wsrep_local_state_comment
      - type: JAVASCRIPT
        parameters:
        - 'return value === ''Synced'' ? 1 : 0;'
      master_item:
        key: 'mysql.get_status_variables["tcp://{HOST.CONN}:{$MYSQL.PORT}","{$MYSQL.USER}","{$MYSQL.PASSWORD}"]'
      tags:
      - tag: service
        value: mariadb
      - tag: layer
        value: L4
      - tag: component
        value: galera
    - uuid: 31c76fdf020a4893aa6384ddf6e5ebab
      name: 'Galera: flow control paused (cumulative)'
      type: DEPENDENT
      key: galera.flow_paused_ns
      delay: '0'
      history: 31d
      value_type: FLOAT
      units: ns
      description: 'Stored cumulative on purpose (CHANGE_PER_SECOND bug ZBX-24890); the ratio is a calculated item.'
      preprocessing:
      - type: JSONPATH
        parameters:
        - $.wsrep_flow_control_paused_ns
      master_item:
        key: 'mysql.get_status_variables["tcp://{HOST.CONN}:{$MYSQL.PORT}","{$MYSQL.USER}","{$MYSQL.PASSWORD}"]'
      tags:
      - tag: service
        value: mariadb
      - tag: layer
        value: L4
      - tag: component
        value: galera
    - uuid: d2606d266afd467c95076f38abef3aaa
      name: 'Galera: flow control paused ratio'
      type: CALCULATED
      key: galera.flow_paused.ratio
      delay: 1m
      history: 31d
      value_type: FLOAT
      params: '(last(//galera.flow_paused_ns)-last(//galera.flow_paused_ns,#2))/60000000000'
      description: 'Share of the last minute replication was paused. 0.1 = paused 10% of the time.'
      tags:
      - tag: service
        value: mariadb
      - tag: layer
        value: L4
      - tag: component
        value: galera
    - uuid: d2eb39dff89b4398af85e45a41ba10ee
      name: 'Galera: local receive queue'
      type: DEPENDENT
      key: galera.recv_queue
      delay: '0'
      history: 31d
      value_type: FLOAT
      preprocessing:
      - type: JSONPATH
        parameters:
        - $.wsrep_local_recv_queue
      master_item:
        key: 'mysql.get_status_variables["tcp://{HOST.CONN}:{$MYSQL.PORT}","{$MYSQL.USER}","{$MYSQL.PASSWORD}"]'
      tags:
      - tag: service
        value: mariadb
      - tag: layer
        value: L4
      - tag: component
        value: galera
    - uuid: 6778e098e94d477388869e030387021d
      name: 'MariaDB: threads connected'
      type: DEPENDENT
      key: mysql.threads_connected
      delay: '0'
      history: 31d
      value_type: FLOAT
      preprocessing:
      - type: JSONPATH
